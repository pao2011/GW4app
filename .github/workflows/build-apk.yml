name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK (firmado con clave debug, instalable directamente)
        run: gradle :app:assembleDebug --no-daemon
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GW4App.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GW4App
          path: GW4App.apk
      - name: Publicar en Releases (enlace fijo "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GW4App.apk --title "GW4App (última versión)" \
            --notes "APK listo para instalar en el reloj. Commit ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
